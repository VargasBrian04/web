services:
  db:
    image: postgres:16-alpine
    container_name: colegio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: colegio
      POSTGRES_PASSWORD: colegio_dev
      POSTGRES_DB: colegio_solano_lopez
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: